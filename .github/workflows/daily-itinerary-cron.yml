name: Daily Itinerary Email

on:
  # Desactivado: Evita ejecuciones automáticas diarias programadas
  # schedule:
  #   - cron: "0 8 * * *"
  # Permite ejecución manual únicamente si se desea probar en el futuro
  workflow_dispatch:

jobs:
  send-itinerary:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily itinerary cron endpoint
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/daily-itinerary"
